openapi: 3.0.3
info:
  title: ShopSphere API
  version: "1.0"
  description: REST API for the ShopSphere multi-vendor e-commerce platform.
servers:
  - url: http://localhost:5000/api/v1
paths:
  /auth/login:
    post:
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      role: { type: string, enum: [customer, seller, admin] }
        "401":
          description: Invalid credentials

  /products:
    get:
      summary: List products
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Paginated product list
    post:
      summary: Create a product (seller only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created

  /products/suggest-category:
    post:
      summary: Suggest categories for a product title and description (seller only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Top 3 category suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  low_confidence: { type: boolean }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        confidence: { type: number }
        "400":
          description: Missing or invalid input

  /orders:
    post:
      summary: Place an order from the current cart
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Order created, payment pending
        "409":
          description: Insufficient stock for one or more items

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductInput:
      type: object
      required: [title, category, price_cents, stock]
      properties:
        title: { type: string }
        category: { type: string }
        price_cents: { type: integer }
        stock: { type: integer }
        attributes: { type: object }
